# Shared runtime tuning used by `train`, `test`, and `eval`.
#
# Keep this file focused on knobs that affect environment behavior, flight
# dynamics, reward shaping, and rule-based safety behavior. The per-mode config
# files should mainly hold entry-point concerns such as algorithm choice,
# checkpoint paths, mission definitions, and reporting options.
tuning:
  env:
    # Values in `shared` are inherited by all run modes unless a mode-specific
    # section below overrides them.
    shared:
      # Physics/update timestep in seconds.
      dt: 0.3

      # Maximum number of simulation steps before an episode truncates.
      max_steps: 10000

      # Separation threshold, in meters, where aircraft start receiving
      # caution-zone shaping penalties and urgency features.
      caution_dist: 50

      # Separation threshold, in meters, that counts as a critical safety
      # violation and ends the episode.
      critical_dist: 10

    train:
      # Training generates fresh waypoint missions on reset.
      mode: "gen_mission"

      # Fraction of the map width/height reserved away from the edge when
      # generating waypoints. Higher values keep generated waypoints farther
      # from the geofence.
      boundary_margin: 0.05

      # Target number of pending/generated waypoints to keep in each UAV queue
      # during procedural mission generation.
      mission_waypoint_count: 3

    test:
      # Test mode can still run generated missions, but the test config can
      # also define manual missions per aircraft.
      mode: "gen_mission"

      # Radius used by the visualizer glow effect around active targets.
      wp_hit_radius: 30

      # Default map origin used by the test entry point.
      origin: [37.7749, -122.4194]

      # Width/height of the square test map in meters.
      box_size: 1500

    eval:
      # Random eval mission size range in meters.
      box_min_m: 800
      box_max_m: 1600

  flight:
    # Flight dynamics knobs. These are intentionally named with units so we do
    # not confuse turning radius with turn rate again.
    #
    # Important:
    # `turning_radius_m` is in meters, not degrees/sec or rad/sec. The code
    # computes max turn rate as `cruise_speed / turning_radius`, which only
    # makes physical sense when speed is meters/second and radius is meters.
    shared: {}

    train:
      # Nominal cruise speed for new training UAVs, in meters/second.
      cruise_speed_mps: 25

      # Uniform random variation applied around `cruise_speed_mps` on reset.
      # Example: 25 +/- 10 gives a sampled range of 15..35 m/s.
      cruise_speed_variation_mps: 10

      # Nominal turning radius for new training UAVs, in meters.
      turning_radius_m: 30

      # Uniform random variation applied around `turning_radius_m` on reset.
      # Example: 30 +/- 15 gives a sampled range of 15..45 m.
      turning_radius_variation_m: 15

    eval:
      # Eval missions sample aircraft cruise speed from this range, in m/s.
      cruise_speed_min_mps: 15.0
      cruise_speed_max_mps: 40.0

      # Eval missions sample aircraft turning radius from this range, in m.
      turning_radius_min_m: 20.0
      turning_radius_max_m: 60.0

  rewards:
    # Dense reward for reducing distance to the current waypoint each step.
    progress_scale: 6.0

    # Bonus for beating the UAV's best-so-far distance to the current waypoint.
    # This helps prevent reward farming by circling.
    best_dist_scale: 3.0

    # Quadratic action penalty. Larger values discourage aggressive turning.
    control_effort_penalty: 0.3

    # Flat time penalty per step to encourage efficient missions.
    timestep_penalty: 0.1

    # Sparse reward granted when a waypoint is reached.
    waypoint_hit_reward: 3000.0

    # Base multiplier for geofence overshoot punishment.
    geofence_base_penalty: 20.0

    # Exponential growth factor for geofence punishment.
    geofence_exp_k: 1.0

    # Linear shaping penalty scale inside the caution zone.
    caution_scale_penalty: 8.0

    # Large terminal penalty when a critical separation violation occurs.
    crash_penalty: 5000.0

    # Additional penalty applied whenever the hard safety controller has to
    # override the policy action.
    safety_override_penalty: 25.0

  hard_safety:
    # When enabled, the environment may replace the learned action with a
    # forced turn-away action before physics integration.
    enabled: true

    # Activation distance in meters for the hard safety fallback. This should
    # be comfortably larger than `critical_dist` for fixed-wing aircraft so
    # they have enough space to actually diverge before impact.
    activation_dist: 50.0

    # Distance in meters below which an already-triggered safety turn is
    # allowed to keep steering away from the threat.
    release_dist: 100.0

    # Number of steps to hold the chosen escape turn once triggered. This makes
    # the fallback visibly commit to a breakout instead of flickering.
    hold_steps: 5

    # Magnitude of the forced turn command in normalized action space.
    # `1.0` means command the maximum available turn rate away from the threat.
    turn_strength: 0.75

    # If true, only intervene when the pair is actually closing rather than
    # merely nearby.
    require_closing: true

  anti_circling:
    # When enabled, navigating UAVs that spend too long turning around without
    # making waypoint progress will get a short forced breakout toward the
    # active waypoint. This does not apply in loiter mode.
    enabled: true

    # Minimum per-step waypoint progress, in meters, that counts as meaningful
    # forward progress. Smaller improvements are treated as stagnation.
    min_progress_m: 1.0

    # Only consider the UAV "stalled" if it is still this many meters or more
    # away from the active waypoint.
    min_distance_from_wp_m: 25.0

    # Minimum normalized action magnitude before we consider the aircraft to be
    # actively turning rather than flying mostly straight.
    min_turn_input: 0.35

    # Number of consecutive stalled-turning steps required before breakout
    # logic activates.
    trigger_steps: 12

    # Number of steps to keep forcing the breakout command once triggered.
    breakout_steps: 18

    # Magnitude of the forced turn command in normalized action space.
    turn_strength: 5.0
