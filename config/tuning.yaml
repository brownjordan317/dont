tuning:
  env:
    shared:
      dt: 0.3
      max_steps: 3000
      timeout_scale_with_mission_size: true
      timeout_steps_per_additional_waypoint: 12
      timeout_scale_with_route_distance: true
      timeout_steps_per_additional_route_km: 120
      timeout_max_steps: 4500
      timeout_reference_route_distance_m: 2800
      obs_stack_size: 8
      waypoint_arrival_radius: 30
      separation_dist: 10
      reset_generation_attempts: 128
      reset_min_feasible_cpa_m: 10
      reset_min_boundary_time_ratio: 0.35
      reset_heading_jitter_rad: 0.2
      min_agents: 2
      max_agents: 5
      boundary_margin: 0.05
      terminate_on_geofence_violation: true
      geofence_breach_grace_steps: 1

    train:
      mission_waypoint_count: 12
      mission_waypoint_count_min: 6
      mission_waypoint_count_max: 20
      box_min_m: 500
      box_max_m: 1800

    test:
      waypoint_arrival_radius: 30
      origin: [37.7749, -122.4194]
      box_size: 2000

    eval:
      box_min_m: 800
      box_max_m: 1600

  flight:
    shared:
      min_start_separation_m: 80.0
      turn_response_time_s: 0.5

    train:
      cruise_speed_mps: 30
      cruise_speed_variation_mps: 15
      turning_radius_m: 50
      turning_radius_variation_m: 20

    eval:
      cruise_speed_min_mps: 15.0
      cruise_speed_max_mps: 45.0
      turning_radius_min_m: 30.0
      turning_radius_max_m: 70.0

  rewards:
    waypoint_hit_reward: 140.0
    geofence_penalty: 60.0
    geofence_breach_penalty: 700.0
    boundary_soft_penalty: 1.2
    boundary_soft_growth_exponent: 1.15
    geofence_growth_exponent: 1.35
    geofence_depth_cap: 1.0
    crash_penalty: 700.0
    harsh_turn_penalty: 0.35
    harsh_turn_threshold: 0.6
    circling_activation_steps: 45
    circling_activation_turns: 1.25
    circling_min_distance_ratio: 1.05
    circling_progress_reset_m: 1.0
    circling_relief_steps: 10
    circling_relief_turn_fraction: 0.3
    stagnation_step_threshold: 12
    stagnation_progress_epsilon_m: 1.0
    incomplete_mission_penalty: 500.0
    existence_penalty: 0.03

  guidance:
    lookahead_time_s: 1.8
    min_lookahead_m: 20.0
    max_lookahead_m: 90.0
    route_commit_scale: 1.8
    turn_gain: 1.5
    turn_lookahead_scale: 0.9
    turn_radius_floor_scale: 1.0
    waypoint_reapproach_min_steps: 14
    waypoint_reapproach_release_distance_scale: 2.4
    waypoint_reapproach_release_arrival_scale: 3.5
    boundary_buffer_ratio: 0.1
    caution_lookahead_time_s: 8.0
    predicted_caution_weight: 0.5
    head_on_conflict_weight: 0.5
    conflict_commit_activation: 0.2
    conflict_commit_release_scale: 1.0
    conflict_commit_release_pressure: 0.25
    avoidance_neighbor_influence_scale: 1.0
    avoidance_boundary_influence_scale: 1.75
    avoidance_lateral_bias: 0.6
    avoidance_center_pull: 0.35
    manager_avoid_neighbor_threshold: 0.18
    manager_avoid_boundary_threshold: 0.22
